<!doctype html>
<html><head><meta charset="utf-8">
<title>Yottasynth Screenshots</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#0b1220;color:#fff;margin:24px;}
h1{font-size:28px;margin:0 0 16px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px;}
.card{background:#121b2d;border:1px solid #273449;border-radius:14px;padding:16px;}
.card h2{font-size:16px;margin:0 0 12px;color:#d5e1f5;}
img{width:100%;height:auto;display:block;background:#09111f;border-radius:10px;}
</style></head><body>
<h1>Yottasynth Screenshots</h1>
<div class="grid">
<div class="card">
<h2>PLAY</h2>
<img src="play.svg" alt="PLAY" />
</div>
<div class="card">
<h2>OSC / MIX</h2>
<img src="osc.svg" alt="OSC / MIX" />
</div>
<div class="card">
<h2>FILTER / AMP</h2>
<img src="filt.svg" alt="FILTER / AMP" />
</div>
<div class="card">
<h2>MOD</h2>
<img src="mod.svg" alt="MOD" />
</div>
<div class="card">
<h2>FX</h2>
<img src="fx.svg" alt="FX" />
</div>
<div class="card">
<h2>ARPEGGIATOR</h2>
<img src="arp.svg" alt="ARPEGGIATOR" />
</div>
<div class="card">
<h2>SEQUENCER</h2>
<img src="seq.svg" alt="SEQUENCER" />
</div>
<div class="card">
<h2>SETTINGS</h2>
<img src="set.svg" alt="SETTINGS" />
</div>
</div></body></html>
